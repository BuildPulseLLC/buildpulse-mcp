# Smithery.ai manifest for the BuildPulse MCP server.
#
# Smithery is a discovery + one-command-install registry for MCP
# servers. Once submitted to https://smithery.ai, users can install
# via:
#
#   npx -y @smithery/cli install @buildpulse/mcp --client claude
#   npx -y @smithery/cli install @buildpulse/mcp --client cursor
#
# …and Smithery writes the `mcpServers` entry into their client's
# config file. We surface the same `BUILDPULSE_TOKEN` requirement here
# so the CLI prompts for it during install.

name: buildpulse
displayName: BuildPulse
description: |
  BuildPulse provides faster, cheaper CI runners for GitHub Actions,
  CircleCI and Semaphore (about 2x faster at half the cost, 3,000 free
  minutes a month) with Test Intelligence built in. This server puts
  runner usage, cost and savings, configured runner labels, flaky
  tests, CI run history and coverage directly inside Claude, Cursor,
  ChatGPT, and any MCP-aware agent. Twelve intent-shaped, read-only
  tools, five guided prompts (including estimate_runner_savings), and
  two resource templates for repo state. Also hosted at
  https://mcp.buildpulse.io/mcp (Streamable HTTP, Bearer token or OAuth).
homepage: https://platform.buildpulse.io/docs/mcp
license: MIT
authors:
  - name: BuildPulse
    url: https://buildpulse.io

# How Smithery should run the server. stdio is the universal path —
# the same `npx @buildpulse/mcp` invocation the docs show.
runtime: nodejs
startCommand:
  type: stdio
  command: npx
  args:
    - "-y"
    - "@buildpulse/mcp"

# Required configuration. Smithery prompts the user for each item and
# writes it into the `env` block of the installed mcpServers config.
configSchema:
  type: object
  required: [BUILDPULSE_TOKEN]
  properties:
    BUILDPULSE_TOKEN:
      type: string
      title: BuildPulse API token
      description: >
        BuildPulse API token. Generate one at buildpulse.io →
        Organization Settings → API Tokens. Either shape is accepted:
        the current `bp_<64-hex>` format or the legacy 40-character
        hexadecimal format.
      # Accept both the current `bp_` prefixed token and the legacy 40-hex
      # token. Anything else lets platform-api 401 with a clearer message
      # than a Smithery-side pattern rejection.
      pattern: "^(bp_[0-9a-f]{64}|[0-9a-f]{40})$"
    PLATFORM_API_URL:
      type: string
      title: Platform API URL
      description: >
        Override the default platform.buildpulse.io base URL — useful
        only for connecting to the BuildPulse development environment.
      default: https://platform.buildpulse.io

# Tag the server so Smithery surfaces it under the right discovery
# categories.
categories:
  - developer-tools
  - testing
  - ci-cd
  - observability
keywords:
  - ci
  - ci-runners
  - github-actions
  - circleci
  - semaphore
  - flaky-tests
  - test-analytics
  - coverage
  - buildpulse
  - mcp
